name: Update README

on:
  push:
    branches: [main]
  schedule:
    # 00:00 IST (UTC+5:30) every day.
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    # Do not loop on the bot's own commit, but do run when a human edits only
    # README.md so a manual change is repaired immediately.
    if: >-
      github.event_name != 'push'
      || (github.actor != 'github-actions[bot]'
      && !contains(github.event.head_commit.message || '', '[skip ci]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run test suite
        run: python3 .github/readme/test_readme.py

      - name: Generate README
        run: python3 .github/readme/update_readme.py

      - name: Validate generated files
        run: python3 .github/readme/update_readme.py --check

      - name: Commit only when the README changed
        shell: bash
        run: |
          set -euo pipefail

          test -s README.md
          test -s .github/readme/roadmap.svg
          test -s .github/readme/banner.svg
          test -s .github/readme/badges.svg

          if [ -z "$(git status --porcelain -- README.md .github/readme/roadmap.svg .github/readme/banner.svg .github/readme/badges.svg)" ]; then
            echo "README and images are unchanged. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md .github/readme/roadmap.svg .github/readme/banner.svg .github/readme/badges.svg
          git commit -m "docs: auto-update README [skip ci]"

          # Rebase before every push. Retry because another push may land first.
          for attempt in 1 2 3; do
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              # Remote changed under us. Rebuild from the remote tip instead of
              # ever forcing a conflicted or broken README.
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              python3 .github/readme/update_readme.py
              python3 .github/readme/update_readme.py --check
              git add README.md .github/readme/roadmap.svg .github/readme/banner.svg .github/readme/badges.svg
              if git diff --cached --quiet; then
                echo "Nothing to push after rebase."
                exit 0
              fi
              git commit -m "docs: auto-update README [skip ci]"
              sleep 3
              continue
            fi

            # Never push files that fail the structural check, even after a rebase.
            if ! python3 .github/readme/update_readme.py --check; then
              echo "Generated files need repair after rebase; regenerating." >&2
              python3 .github/readme/update_readme.py
              if ! python3 .github/readme/update_readme.py --check; then
                echo "Generated files still failed validation after repair." >&2
                git reset --hard "origin/${GITHUB_REF_NAME}" || true
                exit 1
              fi
              git add README.md .github/readme/roadmap.svg .github/readme/banner.svg .github/readme/badges.svg
              git commit --amend --no-edit
            fi

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 3
          done

          echo "Could not push after 3 attempts." >&2
          exit 1
